name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  validate-json:
    name: Validate JSON content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python JSON check
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("client/data")
          files = list(root.rglob("*.json"))
          if not files:
              print("No JSON files found", file=sys.stderr)
              sys.exit(1)
          for path in files:
              with path.open() as f:
                  json.load(f)
              print("OK", path)
          print(f"Validated {len(files)} files")
          PY

  godot-smoke:
    name: Godot V0 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: /tmp/godot-ci
          key: godot-4.3-stable-linux-x86_64
      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-ci
          if [ ! -x /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64 ]; then
            curl -fsSL -o /tmp/godot.zip \
              https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
            unzip -o /tmp/godot.zip -d /tmp/godot-ci
            chmod +x /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64
          fi
          /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64 --version
      - name: Import project
        working-directory: client
        run: |
          /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64 --headless --path . --import
      - name: Smoke V0-A
        working-directory: client
        run: |
          /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64 --headless --path . -s res://scripts/tools/smoke_v0a.gd
      - name: Smoke V0-C
        working-directory: client
        run: |
          /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64 --headless --path . -s res://scripts/tools/smoke_v0c.gd
      - name: Smoke CH01 campaign
        working-directory: client
        run: |
          /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64 --headless --path . -s res://scripts/tools/smoke_ch01.gd
      - name: Smoke ApiClient mock
        working-directory: client
        run: |
          /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64 --headless --path . -s res://scripts/tools/smoke_api.gd
      - name: Smoke Phase1 MVP
        working-directory: client
        run: |
          /tmp/godot-ci/Godot_v4.3-stable_linux.x86_64 --headless --path . -s res://scripts/tools/smoke_mvp.gd

  go-api:
    name: Go API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bashlegends
          POSTGRES_PASSWORD: bashlegends
          POSTGRES_DB: bashlegends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bashlegends"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bashlegends:bashlegends@localhost:5432/bashlegends?sslmode=disable
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test server
        working-directory: server
        run: go test ./... -count=1
      - name: Live API integration smoke (memory)
        env:
          DATABASE_URL: ""
          REDIS_ADDR: ""
        run: bash scripts/smoke_live_api.sh
      - name: Load smoke
        env:
          DATABASE_URL: ""
          REDIS_ADDR: ""
          LOAD_N: "24"
        run: bash scripts/load_smoke.sh
      - name: Live API smoke (postgres+redis)
        working-directory: server
        run: |
          set -euo pipefail
          go build -o /tmp/bashlegends-api ./cmd/api
          /tmp/bashlegends-api -addr :8081 -content ../client/data \
            -database-url "$DATABASE_URL" -redis "$REDIS_ADDR" \
            -migrate migrations &
          PID=$!
          trap 'kill $PID' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8081/healthz && break; sleep 0.15; done
          AUTH=$(curl -fsS -X POST http://127.0.0.1:8081/v1/auth/anonymous)
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"$AUTH")
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8081/v1/me/progress | grep -q account_id
          echo "postgres_redis_smoke_ok"

  docs-presence:
    name: Required docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          set -euo pipefail
          for f in \
            AGENTS.md \
            docs/STATUS.md \
            docs/TASK_QUEUE.md \
            docs/DECISIONS.md \
            docs/PHASE0_SPEC.md \
            docs/PHASE2_AUDIT.md \
            docs/V0_REVIEW.md \
            client/project.godot \
            server/go.mod \
            server/cmd/api/main.go
          do
            test -f "$f" && echo "OK $f"
          done
