name: afk_mmorpg
description: БашЛегенды — 2.5D AFK MMORPG демо (Flutter + Flame)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/roster/mage/
    - assets/images/roster/swordsman/
    - assets/images/roster/knight/
    - assets/images/roster/wolf/
    - assets/images/roster/skeleton/
    - assets/images/roster/goblin/
    - assets/images/roster/forest/
    - assets/images/roster/CREDITS.md
